[package]
name = "heart_beat_logger"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
backend = { path = "../../backend" }
api_client = { path = "../../api_client" }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
thiserror = "2.0.3"
tokio = { version = "1.0", features = ["full"] }
serde_json = "1.0.128"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6.2"