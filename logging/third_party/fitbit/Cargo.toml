[package]
name = "fitbit"
version = "0.1.0"
edition = "2021"

[dependencies]
statistics = { path = "../../../domain/models/statistics" }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0.128"
dirs = "5.0.1"
serde = { version = "1.0.210", features = ["derive"] }
thiserror = "2.0.3"
anyhow = "1.0.89"
reqwest = { version = "0.12.8", features = ["blocking", "json"] }
rust-ini = "0.21"