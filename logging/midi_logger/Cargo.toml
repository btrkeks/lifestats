[package]
name = "midi_logger"
version = "0.1.0"
edition = "2021"

[dependencies]
statistics = { path = "../../domain/models/statistics" }
heart_beat_logger = { path = "../heart_beat_logger" }
anyhow = "1.0"
midir = "0.10.0"
ctrlc = "3.4"
tokio = { version = "1.0", features = ["full"] }
log = "0.4"
env_logger = "0.11.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
serde_with = { version = "3.9.0", features = ["chrono_0_4"] }

[dev-dependencies]
tempfile = "3.8"