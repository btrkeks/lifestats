[package]
name = "web_server"
version = "0.1.0"
edition = "2021"

[dependencies]
statistics = { path = "../../../domain/models/statistics" }
plotting = { path = "../../../domain/models/plotting" }
web_api = { path = "../api" }
rocket = { version = "0.5.0", features = ["json"] }
rocket_dyn_templates = { version = "0.2.0", features = ["tera"] }
time = { version = "0.3", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0.3"
env_logger = "0.11.5"
log = "0.4.22"

[dev-dependencies]
reqwest = { version = "0.12.9", features = ["json"] }
wiremock = "0.6.2"