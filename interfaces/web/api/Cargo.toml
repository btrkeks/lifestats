[package]
name = "web_api"
version = "0.1.0"
edition = "2021"

[dependencies]
statistics = { path = "../../../domain/models/statistics" }
anyhow = "1.0"
thiserror = "2.0.3"
reqwest = { version = "0.12.9", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["serde", "local-offset"] }
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
wiremock = "0.6.2"
tokio-test = "0.4"