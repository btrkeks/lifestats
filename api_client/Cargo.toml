[package]
name = "api_client"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
thiserror = "2.0.3"
reqwest = { version = "0.12.9", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["serde", "local-offset"] }
tokio = { version = "1.0", features = ["full"] }
backend = { path = "../backend" }

[dev-dependencies]
wiremock = "0.5"
tokio-test = "0.4"