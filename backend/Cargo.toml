[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
dirs = "5.0.1"
thiserror = "2.0.3"
serde = { version = "1.0.210", features = ["derive"] }
log = "0.4.22"
serde_json = "1.0.128"
serde_with = { version = "3.9.0", features = ["chrono_0_4"] }
anyhow = "1.0.89"
strum = "0.26.3"
strum_macros = "0.26.4"
enum_dispatch = "0.3.13"
cached = "0.54.0"