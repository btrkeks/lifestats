[workspace]

resolver = "2"
members = [
    "core/core",
    "core/application",
    "core/infrastructure/persistence",
    "core/infrastructure/plotting",
    "core/infrastructure/fitbit_client",
    "core/infrastructure/system_clock",
    "core/infrastructure/web_api",
    "core/plot-domain",
    "./logger_applications/midi_logger/",
    "lifestats-bootstrap",
]

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0.100"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
