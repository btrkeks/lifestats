[workspace]

resolver = "2"
members = [
    "core/domain",
    "core/application",
    "core/infrastructure/persistence",
    "core/infrastructure/web_api",
    "client"
]

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"