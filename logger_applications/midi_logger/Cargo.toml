[package]
name = "midi_logger"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core crates for application access
lifestats-bootstrap = { path = "../../lifestats-bootstrap" }
lifestats-application = { path = "../../core/application" }
lifestats-core = { path = "../../core/core" }

# Async runtime and tools
tokio = { version = "1", features = ["full"] }

# MIDI hardware interaction
midir = "0.10.0"

# Terminal UI for port/statistic selection
crossterm = "0.28"

# Graceful shutdown
ctrlc = { version = "3.4", features = ["termination"] }

# Utilities
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"