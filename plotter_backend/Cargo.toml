[package]
name = "plotter_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
backend = { path = "../backend" }
chrono = "0.4.38"
plotters = "0.3.7"
anyhow = "1.0.89"
plotly = "0.10.0"
rand = "0.8.5"
plotpy = "1.10.0"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
log = "0.4.22"
rusqlite = { version = "0.32.1", features = ["bundled"] }
rayon = "1.10.0"
r2d2 = "0.8"
r2d2_sqlite = "0.25.0"
enum_dispatch = "0.3.13"