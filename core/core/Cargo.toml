[package]
name = "lifestats-core"
version = "0.1.0"
edition = "2021"

[features]
testing = ["dep:mockall"]

[dependencies]
chrono = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

strum = "0.27"
strum_macros = "0.27"
thiserror = "2.0.3"
mockall = { version = "0.13.1", optional = true }

uuid = { version = "1.0", features = ["v4"] }
unicode-normalization = "0.1"

[dev-dependencies]
mockall = "0.13.1"
