[package]
name = "lifestats-plotting"
version = "0.1.0"
edition = "2021"

[dependencies]
# Internal dependencies
lifestats-core = { path = "../../core" }
plot-domain = { path = "../../plot-domain" }

# External dependencies
anyhow = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }

# Plotting and rendering libraries
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "ttf", "chrono", "line_series", "point_series"] }
image = { version = "0.25", default-features = false, features = ["png"] }
