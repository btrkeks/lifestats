[package]
name = "lifestats-web-api"
version = "0.1.0"
edition = "2021"

[dependencies]
lifestats-application = { path = "../../application" }
lifestats-core = { path = "../../core" }
plot-domain = { path = "../../plot-domain" }
lifestats-bootstrap = { path = "../../../lifestats-bootstrap" }

# The concrete persistence implementation needed at the composition root
lifestats-persistence = { path = "../persistence", features = ["testing"] }
lifestats-plotting = { path = "../plotting" }
events = { path = "../../../events/event_impl/" }

# Web Framework
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Serialization & Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Validation
validator = { version = "0.20", features = ["derive"] }
regex = "1.10"

# Error Handling & Logging
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
dotenvy = "0.15"

# Date/Time
chrono = { workspace = true }

# OAuth & State Management
moka = { version = "0.12", features = ["future"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
base64 = "0.22"
sha2 = "0.10"
url = "2.0"
rand = "0.8"

[dev-dependencies]
# For making in-memory requests to the axum router
axum-test = "18.1"

# For HTTP client in E2E tests
reqwest = { version = "0.12", features = ["json"] }

# For async testing
tokio-test = "0.4"

# For mocking
mockall = "0.13.1"

# Enable testing feature to access mocks
lifestats-core = { path = "../../core", features = ["testing"] }
plot-domain = { path = "../../plot-domain", features = ["testing"] }

# Database tooling for E2E tests
diesel = { version = "2.0", features = ["sqlite", "chrono", "r2d2"] }
diesel_migrations = "2.1.0"
