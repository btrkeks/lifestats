[package]
name = "lifestats-persistence"
version = "0.1.0"
edition = "2021"

[features]
testing = []
db-compat-test = []

[dependencies]
# Internal: Implements repository traits from both domains
lifestats-core = { path = "../../core" }
plot-domain = { path = "../../plot-domain" }

chrono = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

diesel = { version = "2.0", features = ["sqlite", "chrono", "r2d2"] }
diesel_migrations = "2.1.0"

dotenvy = "0.15"
once_cell = "1.20.2"

[dev-dependencies]
# For integration tests
lifestats-application = { path = "../../application" }
