[package]
name = "lifestats-application"
version = "0.1.0"
edition = "2021"

[dependencies]
# Internal: Domain crates
lifestats-core = { path = "../core" }
plot-domain = { path = "../plot-domain" }

events = { path = "../../events/event_impl/" }

# External
chrono = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1"
chrono-tz = "0.10.4"
futures = "0.3"
rand = "0.8"
secrecy = "0.8"
thiserror = "2.0"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
zeroize = { version = "1.6", features = ["derive"] }

[dev-dependencies]
mockall = "0.13.1"
lifestats-core = { path = "../core", features = ["testing"] }
plot-domain = { path = "../plot-domain", features = ["testing"] }
