[package]
name = "lifestats-application"
version = "0.1.0"
edition = "2021"

[dependencies]
# Internal: Domain crates
lifestats-core = { path = "../core" }
plot-domain = { path = "../plot-domain" }

events = { path = "../../events/event_impl/" }

# External
chrono = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2.0"
tokio = { version = "1", features = ["sync"] }
log = "0.4"

[dev-dependencies]
mockall = "0.13.1"
lifestats-core = { path = "../core", features = ["testing"] }
plot-domain = { path = "../plot-domain", features = ["testing"] }
