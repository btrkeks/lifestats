[package]
name = "lifestats-application"
version = "0.1.0"
edition = "2021"

[dependencies]
# Internal: Only domain
lifestats-domain = { path = "../domain" }

events = { path = "../../events/event_impl/" }

# External
chrono = { workspace = true }
anyhow = { workspace = true }
log = "0.4.22"
mockall = "0.13.1"
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"

[dev-dependencies]
lifestats-domain = { path = "../domain", features = ["testing"] }
