[package]
name = "web_server"
version = "0.1.0"
edition = "2021"

[dependencies]
application_service = { path = "../../../logging_core/core/application_service" }
web_api = { path = "../../../logging_microservice/infrastructure/api" }
transfer_objects = { path = "../../transfer_objects" }
heart_beat_logger = { path = "../../../logging/heart_beat_logger" }
testing_utilities = { path = "../../testing_utilities" }

rocket = { version = "0.5.0", features = ["json"] }
rocket_dyn_templates = { version = "0.2.0", features = ["tera"] }
rocket_cors = "0.6.0"
serde = "1.0.217" # False neagative
time = { version = "0.3", features = ["serde", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0.3"
tokio = "1.42.0"
anyhow = "1.0.95"